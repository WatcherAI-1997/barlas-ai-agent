name: barlas-ai-agent-production

services:
  api:
    build:
      context: .
    image: barlas-ai-agent:${BARLAS_IMAGE_TAG:-production}
    restart: unless-stopped
    env_file:
      - path: ${BARLAS_ENV_FILE:-deploy/production.env}
        required: true
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 17840
      DATABASE_URL: postgresql://barlas_agent:${POSTGRES_PASSWORD}@database:5432/barlas_agent
      WORKSPACE_ROOT: /var/lib/barlas/workspaces
      WEB_ROOT: /app/web
    expose:
      - "17840"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    volumes:
      - workspaces:/var/lib/barlas/workspaces
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:17840/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barlas_agent
      POSTGRES_USER: barlas_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barlas_agent -d barlas_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    image: postgres:17-alpine
    restart: "no"
    environment:
      PGHOST: database
      PGDATABASE: barlas_agent
      PGUSER: barlas_agent
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/opt/barlas/migrate.sh"]
    volumes:
      - ./migrations:/migrations:ro
      - ./deploy/migrate.sh:/opt/barlas/migrate.sh:ro
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      BARLAS_DOMAIN: ${BARLAS_DOMAIN}
    ports:
      - "${BARLAS_HTTP_PORT:-18080}:80"
      - "${BARLAS_HTTPS_PORT:-18443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      PGHOST: database
      PGDATABASE: barlas_agent
      PGUSER: barlas_agent
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["/bin/sh", "/opt/barlas/backup-loop.sh"]
    volumes:
      - ./deploy/backup-loop.sh:/opt/barlas/backup-loop.sh:ro
      - backups:/backups
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  frontend:
    name: barlas-ai-agent-production-frontend
  backend:
    name: barlas-ai-agent-production-backend
    internal: true

volumes:
  database:
    name: barlas-ai-agent-production-db
  workspaces:
    name: barlas-ai-agent-production-workspaces
  backups:
    name: barlas-ai-agent-production-backups
  caddy_data:
    name: barlas-ai-agent-production-caddy-data
  caddy_config:
    name: barlas-ai-agent-production-caddy-config
