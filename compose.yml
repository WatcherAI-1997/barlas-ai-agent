name: barlas-ai-agent

services:
  api:
    build:
      context: .
    container_name: barlas-ai-agent-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 17840
      DATABASE_URL: postgresql://barlas_agent:${POSTGRES_PASSWORD}@database:5432/barlas_agent
      WORKSPACE_ROOT: /var/lib/barlas/workspaces
    ports:
      - "127.0.0.1:17840:17840"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - barlas-ai-agent
    read_only: true
    volumes:
      - barlas-ai-agent-workspaces:/var/lib/barlas/workspaces
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  database:
    image: postgres:17-alpine
    container_name: barlas-ai-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: barlas_agent
      POSTGRES_USER: barlas_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - barlas-ai-agent-db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - barlas-ai-agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barlas_agent -d barlas_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  browser:
    build:
      context: .
      dockerfile: deploy/browser/Dockerfile
    image: barlas-ai-agent-browser:development
    profiles: ["browser"]
    restart: unless-stopped
    init: true
    user: pwuser
    expose:
      - "3000"
    networks:
      - barlas-ai-agent
      - barlas-browser-egress
    read_only: true
    tmpfs:
      - /tmp:size=512m,nosuid,nodev
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  barlas-ai-agent:
    name: barlas-ai-agent-net
  barlas-browser-egress:
    name: barlas-ai-agent-browser-egress

volumes:
  barlas-ai-agent-db:
    name: barlas-ai-agent-db
  barlas-ai-agent-workspaces:
    name: barlas-ai-agent-workspaces
